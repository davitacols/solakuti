# Solakuti production stack for a single VPS.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Services: Postgres (two DBs) · Django/Gunicorn · Next.js · Nginx (TLS + static/media).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solakuti}
      POSTGRES_USER: ${POSTGRES_USER:-solakuti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPORTS_DB: ${SPORTS_DB:-solakuti_sports}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the second (sports) database on first boot.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solakuti}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    env_file:
      - .env.prod
    volumes:
      - media_data:/app/mediafiles
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_ADSENSE_ADS_ENABLED: ${NEXT_PUBLIC_ADSENSE_ADS_ENABLED}
        NEXT_PUBLIC_ADSENSE_SLOT_HOME_MID: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME_MID}
        NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID: ${NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE_MID}
        NEXT_PUBLIC_ADSENSE_SLOT_CATEGORY_MID: ${NEXT_PUBLIC_ADSENSE_SLOT_CATEGORY_MID}
        NEXT_PUBLIC_ADSENSE_SLOT_CATEGORY_SIDEBAR: ${NEXT_PUBLIC_ADSENSE_SLOT_CATEGORY_SIDEBAR}
    restart: unless-stopped
    environment:
      # MAINTENANCE_MODE / MAINTENANCE_BYPASS_TOKEN are read at request time by
      # the Next.js middleware, so they can live here (no rebuild to toggle).
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-off}
      MAINTENANCE_BYPASS_TOKEN: ${MAINTENANCE_BYPASS_TOKEN:-}
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
