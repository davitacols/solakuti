# Solakuti — Nginx reverse proxy, TLS termination, static + media.
# Backend (Django) owns /api, /admin, /static, /media; everything else is Next.js.

upstream solakuti_backend  { server backend:8000; }
upstream solakuti_frontend { server frontend:3000; }

# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    server_name solakuti.com www.solakuti.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.solakuti.com$request_uri;
    }
}

# Redirect the apex to www (canonical) over HTTPS.
server {
    listen 443 ssl;
    http2 on;
    server_name solakuti.com;

    ssl_certificate     /etc/letsencrypt/live/solakuti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solakuti.com/privkey.pem;

    # Serve ads.txt directly at the apex (the domain AdSense registered) so its
    # crawler finds it without following the apex->www redirect.
    location = /ads.txt {
        proxy_pass http://solakuti_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://www.solakuti.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.solakuti.com;

    ssl_certificate     /etc/letsencrypt/live/solakuti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solakuti.com/privkey.pem;

    client_max_body_size 60m;   # matches DATA_UPLOAD_MAX_MEMORY_SIZE (50m) + headroom

    # Django API and admin.
    location ~ ^/(api|admin)/ {
        proxy_pass http://solakuti_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django collected static (admin, DRF).
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    # Self-hosted uploads.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Everything else: Next.js.
    location / {
        proxy_pass http://solakuti_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
